<!DOCTYPE html>
<html>
<head>
    <title>Admin Login Test</title>
</head>
<body>
    <input type="text" id="search-input" placeholder="admin log in yaz ve Enter'a bas" onkeyup="checkSearchInput(event)">

    <div id="adminLoginModal" style="display:none; border:2px solid red; padding:20px; margin-top:20px;">
        <h2>Admin Giriş Modalı Açıldı!</h2>
    </div>

    <script>
        function openModal(id) {
            document.getElementById(id).style.display = 'block';
        }

        function checkSearchInput(event) {
            if (event.key !== 'Enter') return;
            const input = document.getElementById('search-input');
            const val = input.value.trim().toLowerCase();
            if (val === 'admin log in') {
                input.value = '';
                openModal('adminLoginModal');
                event.preventDefault();
            }
        }
    </script>
</body>
</html>
