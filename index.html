<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katalog</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f7f6; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Şık Üst Menü Çubuğu (Navbar) */
        .navbar {
            background: #2c3e50; color: #fff; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000;
        }
        .navbar h1 { font-size: 1.2rem; font-weight: bold; }

        .container { flex: 1; max-width: 800px; width: 100%; margin: 0 auto; padding: 15px; }
        .search-box { margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; outline: none; }
        
        /* Admin Giriş Modalı (Gizli Başlar) */
        #admin-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content {
            background: #fff; padding: 25px; border-radius: 10px; width: 90%; max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); text-align: center;
        }
        .modal-content h3 { margin-bottom: 15px; color: #2c3e50; }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .modal-content button { background: #2c3e50; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .modal-content button:hover { background: #34495e; }
        .close-btn { background: #e74c3c !important; margin-top: 10px; }

        /* Footer / İletişim Alanı (En altta) */
        footer {
            background: #2c3e50; color: #fff; text-align: center;
            padding: 20px; margin-top: auto; font-size: 0.9rem;
        }
        footer p { margin: 5px 0; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1 id="app-title">Katalog</h1>
        <span>🛒</span>
    </div>

    <div class="container">
        <div class="search-box">
            <input type="text" id="search-input" onkeyup="checkSearchInput(event)" oninput="handleSearch(this.value)" placeholder="🔍 بحث عن منتج... / Ürün ara...">
        </div>
        <div id="products-container">
            </div>
    </div>

    <div id="admin-modal">
        <div class="modal-content">
            <h3>🔒 Admin Girişi</h3>
            <input type="email" id="admin-email" placeholder="E-posta adresiniz">
            <input type="password" id="admin-password" placeholder="Şifreniz">
            <button onclick="loginAdmin()">Giriş Yap</button>
            <button class="close-btn" onclick="closeAdminModal()">Kapat</button>
        </div>
    </div>

    <footer>
        <p>📞 Telefon: <span id="footer-phone">-</span></p>
        <p>✉️ E-posta: <span id="footer-email">info@ornek.com</span></p>
        <p style="font-size: 0.8rem; margin-top: 10px; opacity: 0.7;">Tüm Hakları Saklıdır © 2026</p>
    </footer>

    <script>
        // ==================== SUPABASE BAĞLANTISI (TEK VE DOĞRU TANIM) ====================
        const SUPABASE_URL = 'https://xmrdqepjtfycvtgcbkyy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtcmRxZXBqdGZ5Y3Z0Z2Nia3l5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNzkwOTAsImV4cCI6MjEwMTk1NTA5MH0.fDrMNun9fMaFj1PqAkZRpmOF17r0GCWGZNu0mc5k0dU';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let settings = { phone: 'Belirtilmedi' };

        function checkSearchInput(event) {
            const input = document.getElementById('search-input');
            const val = input.value.trim().toLowerCase();
            if ((event.key === 'Enter' || event.keyCode === 13) && val === 'admin log in') {
                input.value = '';
                document.getElementById('admin-modal').style.display = 'flex';
                event.preventDefault();
            }
        }

        function handleSearch(val) {
            console.log("Aranan:", val);
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        async function loginAdmin() {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert('Giriş başarısız: ' + error.message);
            } else {
                alert('Giriş başarılı! Hoş geldiniz.');
                closeAdminModal();
            }
        }

        async function init() {
            try {
                const { data, error } = await supabase.from('settings').select('*').limit(1);
                if (!error && data && data.length > 0) {
                    settings = data[0];
                    if (settings.phone) {
                        document.getElementById('footer-phone').innerText = settings.phone;
                    }
                }
            } catch (err) {
                console.error("Veri çekme hatası:", err);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
