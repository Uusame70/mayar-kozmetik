<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>صيانة مؤقتة - متجر ميار كوزمتيك</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 50px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        p {
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 12px;
            opacity: 0.95;
        }
        .sub {
            font-size: 0.9rem;
            opacity: 0.75;
            margin-top: 20px;
        }
        .whatsapp-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 28px;
            background: #25d366;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s, background 0.2s;
        }
        .whatsapp-btn:hover {
            background: #1ebd59;
            transform: scale(1.05);
        }
        .divider {
            width: 60px;
            height: 3px;
            background: rgba(255, 255, 255, 0.4);
            margin: 20px auto;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">🛠️</span>
        <h1>أعزاءنا العملاء الكرام</h1>
        <div class="divider"></div>
        <p>نعتذر، موقعنا متوقف مؤقتاً بسبب مشاكل تقنية.</p>
        <p>نعمل جاهدين على إصلاح المشكلة وإعادة الموقع للعمل في أقرب وقت ممكن.</p>
        <p>شكراً لتفهمكم وصبركم معنا. 🌸</p>
        <div class="divider"></div>
        <p class="sub">للاستفسار أو الطلبات، تواصلوا معنا مباشرة عبر واتساب:</p>
        <a class="whatsapp-btn" href="https://wa.me/905388444275" target="_blank" rel="noopener">
            💬 تواصل عبر واتساب
        </a>
    </div>
</body>
</html>
