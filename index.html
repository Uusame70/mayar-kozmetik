<body>

        <div class="search-box">
            <!-- Değişiklik burada: onkeydown yerine onkeyup -->
            <input type="text" id="search-input" onkeyup="checkSearchInput(event)" oninput="handleSearch(this.value)" placeholder="🔍 بحث عن منتج... / Ürün ara...">
        </div>
        ... diğer HTML kısmı aynen ...

    <!-- Modallar aynen -->
    ...

    <script>
        // ==================== SUPABASE ====================
        const SUPABASE_URL = 'https://xmrdqepjtfycvtgcbkyy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtcmRxZXBqdGZ5Y3Z0Z2Nia3l5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNzkwOTAsImV4cCI6MjEwMTk1NTA5MH0.fDrMNun9fMaFj1PqAkZRpmOF17r0GCWGZNu0mc5k0dU';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ==================== STATE ====================
        let settings = { lang: 'ar', phone: '', waHeader: '', customAppTitle: '', customDeleteText: '', customAddText: '', customCheckoutText: '' };
        let groups = [];
        let products = [];
        let cart = JSON.parse(localStorage.getItem('catalog_cart')) || [];
        let isAdmin = false;
        let currentFile = null;
        let currentBase64Image = '';
        let selectedCategory = 'ALL';
        let searchQuery = '';

        // ==================== ÇEVİRİLER ====================
        const translations = { /* tam metin yukarıdaki gibi */ };

        // ==================== MODAL ====================
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // ==================== VERİ ÇEKME ====================
        async function fetchSettings() {
            const { data, error } = await supabase.from('settings').select('*').limit(1);
            if (!error && data?.length) settings = { ...settings, ...data[0] };
        }
        async function fetchGroups() {
            const { data, error } = await supabase.from('groups').select('*').order('id');
            if (!error && data) groups = data;
        }
        async function fetchProducts() {
            const { data, error } = await supabase.from('products').select('*').order('id');
            if (!error && data) products = data;
        }

        // ==================== RESİM YÜKLEME ====================
        async function uploadImage(file) {
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}.${fileExt}`;
            const { error } = await supabase.storage.from('product-images').upload(fileName, file);
            if (error) return null;
            const { data: { publicUrl } } = supabase.storage.from('product-images').getPublicUrl(fileName);
            return publicUrl;
        }

        // ==================== ADMIN GİRİŞ (DÜZELTİLDİ) ====================
        async function loginAdmin() {
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value.trim();
            if (!email || !password) return alert('Lütfen e-posta ve şifre girin.');
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) alert('Giriş başarısız: ' + error.message);
            else {
                isAdmin = true;
                closeModal('adminLoginModal');
                updateAdminUI();
                alert('Admin girişi başarılı!');
                await fetchSettings();
                changeLanguage(settings.lang, false);
            }
        }

        async function logoutAdmin() {
            await supabase.auth.signOut();
            isAdmin = false;
            updateAdminUI();
            closeModal('settingsModal');
        }

        // ==================== ARAMA KUTUSU (DÜZELTİLDİ) ====================
        function checkSearchInput(event) {
            const input = document.getElementById('search-input');
            const val = input.value.trim().toLowerCase();
            // Enter tuşu ve "admin log in" kontrolü
            if ((event.key === 'Enter' || event.keyCode === 13) && val === 'admin log in') {
                input.value = '';
                openModal('adminLoginModal');
                event.preventDefault();
                searchQuery = '';
                renderProducts();
            }
        }

        function handleSearch(val) {
            searchQuery = val.trim().toLowerCase();
            renderProducts();
        }

        // ==================== DİL ====================
        function changeLanguage(lang, shouldSave = true) {
            settings.lang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            const t = translations[lang];
            // ... tüm UI metinlerini güncelle (öncekiyle aynı) ...
            renderCategories();
            renderProducts();
            renderCart();
        }
        function toggleLanguage() {
            const next = settings.lang === 'ar' ? 'tr' : 'ar';
            changeLanguage(next, true);
            supabase.from('settings').update({ lang: next }).eq('id', 1);
        }

        // ==================== ADMIN PANELİ ====================
        function updateAdminUI() {
            const adminBar = document.getElementById('adminBar');
            const btnSettings = document.getElementById('btn-settings');
            if (isAdmin) {
                btnSettings.style.display = 'inline-block';
                adminBar.style.display = 'flex';
                document.getElementById('new-phone').value = settings.phone || '';
                document.getElementById('new-wa-header').value = settings.waHeader || '';
                document.getElementById('new-app-title').value = settings.customAppTitle || '';
                document.getElementById('new-delete-text').value = settings.customDeleteText || '';
                document.getElementById('new-add-text').value = settings.customAddText || '';
                document.getElementById('new-checkout-text').value = settings.customCheckoutText || '';
            } else {
                btnSettings.style.display = 'none';
                adminBar.style.display = 'none';
            }
            renderProducts();
        }

        // ==================== AYAR GÜNCELLEME ====================
        async function updateAdminSettings() {
            const newPh = document.getElementById('new-phone').value.trim();
            const newWa = document.getElementById('new-wa-header').value.trim();
            const newApp = document.getElementById('new-app-title').value.trim();
            const newDel = document.getElementById('new-delete-text').value.trim();
            const newAdd = document.getElementById('new-add-text').value.trim();
            const newCheck = document.getElementById('new-checkout-text').value.trim();
            const updateObj = {};
            if (newPh) updateObj.phone = newPh;
            if (newWa) updateObj.wa_header = newWa;
            updateObj.custom_app_title = newApp;
            updateObj.custom_delete_text = newDel;
            updateObj.custom_add_text = newAdd;
            updateObj.custom_checkout_text = newCheck;
            if (newPh) settings.phone = newPh;
            if (newWa) settings.waHeader = newWa;
            settings.customAppTitle = newApp;
            settings.customDeleteText = newDel;
            settings.customAddText = newAdd;
            settings.customCheckoutText = newCheck;
            const { error } = await supabase.from('settings').update(updateObj).eq('id', 1);
            if (error) alert('Kayıt hatası: ' + error.message);
            else alert('Ayarlar kaydedildi!');
            changeLanguage(settings.lang, false);
        }

        // ==================== GRUP İŞLEMLERİ ====================
        async function saveGroup() {
            const name_ar = document.getElementById('new-group-ar').value.trim();
            const name_tr = document.getElementById('new-group-tr').value.trim();
            if (!name_ar && !name_tr) return alert('Lütfen grup adı girin');
            const { data, error } = await supabase.from('groups').insert([{ name_ar, name_tr }]).select();
            if (error) alert('Hata: ' + error.message);
            else if (data) {
                groups.push(data[0]);
                renderGroupsList();
                renderGroupSelect();
                renderCategories();
                document.getElementById('new-group-ar').value = '';
                document.getElementById('new-group-tr').value = '';
            }
        }
        async function deleteGroup(id) {
            if (!confirm('Silmek istediğinize emin misiniz?')) return;
            const { error } = await supabase.from('groups').delete().eq('id', id);
            if (error) alert('Hata: ' + error.message);
            else {
                groups = groups.filter(g => g.id !== id);
                renderGroupsList();
                renderGroupSelect();
                renderCategories();
                renderProducts();
            }
        }
        function renderGroupSelect() { /* aynen */ }
        function renderGroupsList() { /* aynen */ }
        function openGroupModal() { /* aynen */ }

        // ==================== ÜRÜN İŞLEMLERİ ====================
        async function saveProduct() {
            const id = document.getElementById('prod-id').value;
            const price = parseFloat(document.getElementById('prod-price').value) || 0;
            const selectedGroupId = parseInt(document.getElementById('prod-group-select').value);
            const selectedGroup = groups.find(g => g.id === selectedGroupId);
            const category_ar = selectedGroup ? selectedGroup.name_ar : '';
            const category_tr = selectedGroup ? selectedGroup.name_tr : '';
            const name_ar = document.getElementById('prod-name-ar').value.trim();
            const name_tr = document.getElementById('prod-name-tr').value.trim();
            const desc_ar = document.getElementById('prod-desc-ar').value.trim();
            const desc_tr = document.getElementById('prod-desc-tr').value.trim();
            let imgUrl = currentBase64Image;
            if (currentFile) {
                const uploadedUrl = await uploadImage(currentFile);
                if (uploadedUrl) imgUrl = uploadedUrl;
                else imgUrl = 'https://via.placeholder.com/300x200';
                currentFile = null;
            } else if (!imgUrl) imgUrl = 'https://via.placeholder.com/300x200';
            const productData = { img: imgUrl, price, category_ar, category_tr, name_ar, name_tr, desc_ar, desc_tr };
            if (id) {
                const { error } = await supabase.from('products').update(productData).eq('id', id);
                if (error) alert('Güncelleme hatası: ' + error.message);
                else {
                    const index = products.findIndex(p => p.id == id);
                    if (index !== -1) products[index] = { ...products[index], ...productData };
                }
            } else {
                const { data, error } = await supabase.from('products').insert([productData]).select();
                if (error) alert('Ekleme hatası: ' + error.message);
                else if (data) products.push(data[0]);
            }
            closeModal('productModal');
            renderCategories();
            renderProducts();
        }
        async function deleteProduct(id) {
            if (!confirm('Silmek istediğinize emin misiniz?')) return;
            const { error } = await supabase.from('products').delete().eq('id', id);
            if (error) alert('Hata: ' + error.message);
            else {
                products = products.filter(p => p.id !== id);
                cart = cart.filter(c => c.id !== id);
                localStorage.setItem('catalog_cart', JSON.stringify(cart));
                renderCategories();
                renderProducts();
                renderCart();
            }
        }
        function previewSelectedImage(input) {
            const file = input.files[0];
            const preview = document.getElementById('img-preview');
            if (file) {
                currentFile = file;
                const reader = new FileReader();
                reader.onload = e => {
                    currentBase64Image = e.target.result;
                    preview.src = currentBase64Image;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                currentFile = null;
                preview.style.display = 'none';
            }
        }
        function openAddProductModal() { /* aynen */ }
        function editProduct(id) { /* aynen */ }

        // ==================== SEPET ====================
        function addToCart(id) { /* aynen */ }
        function updateQty(id, delta) { /* aynen */ }
        function removeFromCart(id) { /* aynen */ }
        function clearCart() { /* aynen */ }
        function renderCart() { /* aynen */ }
        function completeOrder() { /* aynen */ }
        function formatPhoneForWa(phoneStr) { /* aynen */ }

        // ==================== KATEGORİ & ÜRÜN RENDER ====================
        function renderCategories() { /* aynen */ }
        function renderProducts() { /* aynen */ }
        function openProductDetail(id) { /* aynen */ }

        // ==================== BAŞLAT ====================
        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            isAdmin = !!session;
            await fetchSettings();
            await fetchGroups();
            await fetchProducts();
            cart = JSON.parse(localStorage.getItem('catalog_cart')) || [];
            changeLanguage(settings.lang, false);
            updateAdminUI();
            renderCategories();
            renderProducts();
            renderCart();
            supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN') { isAdmin = true; updateAdminUI(); }
                else if (event === 'SIGNED_OUT') { isAdmin = false; updateAdminUI(); }
            });
        }
        window.onload = init;
    </script>
</body>
</html>
