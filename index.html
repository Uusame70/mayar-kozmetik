<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ميار للتسوق الالكتروني</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ---- MEVCUT STILLER AYNEN (yer kısıtı nedeniyle kısaltılmıştır) ---- */
        * { box-sizing: border-box; margin:0; padding:0; font-family: -apple-system, ...; }
        body { background-color:#f4f6f9; color:#333; padding-bottom:90px; }
        /* ... tüm stiller aynen, araya yeni stiller eklenebilir ... */
        .checkbox-group { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
        .checkbox-group label { display:flex; align-items:center; gap:4px; font-weight:400; font-size:0.9rem; cursor:pointer; }
        .checkbox-group input[type="checkbox"] { width:18px; height:18px; }
    </style>
</head>
<body>
    <!-- YÜKLEME EKRANI, HEADER, ARAMA, KATEGORİ BAR, ADMIN BAR, ÜRÜN GRİDİ, SEPET BAR vs. (AYNEN) -->
    <!-- ... -->

    <!-- ÜRÜN MODALI (productModal) - grup seçimi checkbox olarak değiştirildi -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <h2 id="productModalTitle" style="margin-bottom:15px;">إضافة منتج</h2>
            <input type="hidden" id="prod-id">

            <div class="form-group">
                <label id="lbl-prod-img">صورة المنتج (Fotoğraf Seç)</label>
                <input type="file" id="prod-img-file" accept="image/*" onchange="previewSelectedImage(this)">
                <div id="paste-area" tabindex="0" style="margin-top:8px; padding:12px; border:2px dashed #cbd5e1; border-radius:8px; text-align:center; cursor:pointer; font-size:0.85rem; color:#64748b; background:#f8fafc;" onclick="this.focus()">
                    <span id="txt-paste-hint">📋 انقر هنا ثم الصق الصورة (Ctrl+V)</span>
                </div>
                <img id="img-preview" class="img-preview" alt="Önizleme" loading="lazy">
            </div>

            <div class="form-group">
                <label id="lbl-prod-price">السعر (Fiyat)</label>
                <input type="number" id="prod-price">
            </div>

            <!-- Grup seçimi: checkbox listesi -->
            <div class="form-group">
                <label id="lbl-prod-groups">المجموعات (Gruplar)</label>
                <div id="prod-groups-container" class="checkbox-group"></div>
            </div>

            <div class="form-group">
                <label id="lbl-pname-ar">اسم المنتج (بالعربية)</label>
                <input type="text" id="prod-name-ar">
            </div>
            <div class="form-group">
                <label id="lbl-pname-tr">اسم المنتج (Türkçe)</label>
                <input type="text" id="prod-name-tr">
            </div>
            <div class="form-group">
                <label id="lbl-pdesc-ar">وصف المنتج (بالعربية)</label>
                <textarea id="prod-desc-ar" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label id="lbl-pdesc-tr">وصف المنتج (Türkçe)</label>
                <textarea id="prod-desc-tr" rows="2"></textarea>
            </div>

            <div class="modal-actions">
                <button onclick="saveProduct()" class="btn-success" id="btn-save-prod">حفظ</button>
                <button onclick="closeModal('productModal')" class="btn-danger" id="btn-cancel-prod">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- DİĞER MODALLAR (cart, settings, group, login, detail) AYNEN -->

    <script>
        // ============ SUPABASE BAĞLANTI ============
        const SUPABASE_URL = 'https://xmrdqepjtfycvtgcbkyy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_MgJhvhCdIg9oC40t--FZxQ_04A8dWkU';
        let _supabase;
        if (typeof supabase !== 'undefined') {
            _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        const STORAGE_BUCKET = 'product-images';
        const PAGE_SIZE = 12;

        const defaultSettings = {
            id: 1,
            lang: 'ar',
            phone: '0507 444 45 02',
            waHeader: 'طلب جديد',
            customAppTitle: '',
            customDeleteText: '',
            customAddText: '',
            customCheckoutText: ''
        };

        let settings = defaultSettings;
        let groups = [];
        let cart = JSON.parse(localStorage.getItem('catalog_cart')) || [];
        let isAdmin = false;

        let currentProducts = [];
        let currentPage = 0;
        let totalProductsCount = 0;
        let isLoadingProducts = false;
        let hasMoreProducts = true;

        let selectedCategory = 'ALL'; // 'ALL' veya grup nesnesi
        let searchQuery = '';
        let searchTimeout = null;

        let currentImageFile = null;
        let currentImageUrl = '';
        let currentImagePreview = '';

        // ÇEVİRİLER (aynen, yeni anahtarlar eklendi)
        const translations = {
            ar: {
                // ... mevcut çeviriler ...
                prodGroups: "المجموعات (اختر واحدة أو أكثر)",
                // diğerleri aynen
            },
            tr: {
                // ... mevcut çeviriler ...
                prodGroups: "Gruplar (bir veya daha fazla seçin)",
                // diğerleri aynen
            }
        };

        // ============ YARDIMCI FONKSİYONLAR (getCdnImageUrl, formatPhoneForWa, vs.) ============
        // ... (mevcut kod aynen)

        // ============ ÜRÜN YÜKLEME (ÇOKLU GRUP DESTEKLİ) ============
        async function loadProducts(page = 0, reset = true) {
            if (isLoadingProducts || !_supabase) return;
            isLoadingProducts = true;

            const bottomLoader = document.getElementById('bottomLoader');
            if (reset) {
                showLoadingScreen();
                document.getElementById('productsGrid').innerHTML = '';
                currentProducts = [];
                totalProductsCount = 0;
                hasMoreProducts = true;
            } else if (bottomLoader) {
                bottomLoader.style.display = 'block';
            }

            try {
                currentPage = page;
                const from = page * PAGE_SIZE;
                const to = from + PAGE_SIZE - 1;

                // 1) Ana ürün sorgusu (filtreler)
                let query = _supabase.from('products').select('*', { count: 'exact' }).range(from, to);

                // Eğer bir kategori seçiliyse, o kategoriye ait product_groups kaydı olan ürünleri bul
                if (selectedCategory !== 'ALL') {
                    // Önce o kategoriye ait product_groups'tan product_id'leri al
                    const { data: pgData, error: pgError } = await _supabase
                        .from('product_groups')
                        .select('product_id')
                        .eq('group_id', selectedCategory.id);
                    if (pgError) throw pgError;
                    const productIds = pgData.map(row => row.product_id);
                    if (productIds.length === 0) {
                        // Hiç ürün yoksa boş liste döndür
                        currentProducts = [];
                        totalProductsCount = 0;
                        hasMoreProducts = false;
                        renderProducts(true);
                        hideLoadingScreen();
                        isLoadingProducts = false;
                        return;
                    }
                    query = query.in('id', productIds);
                }

                if (searchQuery) {
                    query = query.or(`name_ar.ilike."%${searchQuery}%",name_tr.ilike."%${searchQuery}%"`);
                }

                query = query.order('id', { ascending: true });

                const { data: products, count, error } = await query;
                if (error) throw error;

                const productList = products || [];
                totalProductsCount = count || 0;

                // 2) Bu ürünlerin gruplarını çek
                if (productList.length > 0) {
                    const productIds = productList.map(p => p.id);
                    const { data: pgData, error: pgError } = await _supabase
                        .from('product_groups')
                        .select('product_id, group_id, groups(id, name_ar, name_tr)')
                        .in('product_id', productIds);
                    if (pgError) throw pgError;

                    // product_id bazında grupları grupla
                    const groupsMap = {};
                    pgData.forEach(row => {
                        if (!groupsMap[row.product_id]) groupsMap[row.product_id] = [];
                        if (row.groups) groupsMap[row.product_id].push(row.groups);
                    });

                    // Her ürüne groups dizisini ekle
                    productList.forEach(p => {
                        p.groups = groupsMap[p.id] || [];
                    });
                } else {
                    productList.forEach(p => p.groups = []);
                }

                if (reset) {
                    currentProducts = productList;
                } else {
                    currentProducts = currentProducts.concat(productList);
                }

                hasMoreProducts = currentProducts.length < totalProductsCount;
                renderProducts(reset, productList);
            } catch (err) {
                console.error('Ürünler yüklenirken hata:', err);
            } finally {
                isLoadingProducts = false;
                if (reset) hideLoadingScreen();
                else if (bottomLoader) bottomLoader.style.display = 'none';
            }
        }

        function renderProducts(reset = true, newItems = []) {
            const grid = document.getElementById('productsGrid');
            const t = translations[settings.lang];

            if (reset) grid.innerHTML = '';

            const itemsToRender = reset ? currentProducts : newItems;

            if (currentProducts.length === 0 && !isLoadingProducts) {
                grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:#777; padding:20px 0;">${t.noProductsFound}</p>`;
                return;
            }

            const fragment = document.createDocumentFragment();
            itemsToRender.forEach(p => {
                const card = createProductCardElement(p);
                fragment.appendChild(card);
            });
            grid.appendChild(fragment);
        }

        function createProductCardElement(p) {
            const t = translations[settings.lang];
            const addText = settings.customAddText || t.addToCart;
            const shareText = t.share;
            const copyLinkText = t.copyLink;
            const editText = t.edit;
            const deleteText = settings.customDeleteText || t.delete;

            const name = settings.lang === 'ar' ? p.name_ar : p.name_tr;
            // Kategori rozeti: ilk grubu göster (veya hepsini)
            let catNames = [];
            if (p.groups && p.groups.length > 0) {
                catNames = p.groups.map(g => settings.lang === 'ar' ? g.name_ar : g.name_tr);
            }
            const badgeText = catNames.join(' / ');

            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                ${badgeText ? `<span class="product-badge">${badgeText}</span>` : ''}
                <img src="${getCdnImageUrl(p.img)}" alt="${name}" onclick="openProductDetail(${p.id})" loading="lazy">
                <div class="product-info">
                    <div>
                        <div class="product-title" onclick="openProductDetail(${p.id})">${name}</div>
                        <div class="product-price">${p.price} TL</div>
                    </div>
                    <div class="product-actions">
                        <button onclick="addToCart(${p.id})" class="btn-success" style="flex-grow:1;">${addText}</button>
                        <button onclick="shareProduct(${p.id})" class="btn-whatsapp" title="${shareText}">💬 ${shareText}</button>
                        <button onclick="copyProductLink(${p.id})" class="btn-warning" title="${copyLinkText}">🔗 ${copyLinkText}</button>
                        ${isAdmin ? `
                            <button onclick="editProduct(${p.id})">${editText}</button>
                            <button onclick="deleteProduct(${p.id})" class="btn-danger">${deleteText}</button>
                        ` : ''}
                    </div>
                </div>
            `;
            return card;
        }

        // ============ GRUP CHECKBOX'LARINI RENDER ET ============
        function renderGroupCheckboxes(selectedIds = []) {
            const container = document.getElementById('prod-groups-container');
            container.innerHTML = '';
            if (groups.length === 0) {
                container.innerHTML = '<span style="color:#888;">' + (settings.lang === 'ar' ? 'لا توجد مجموعات' : 'Grup yok') + '</span>';
                return;
            }
            groups.forEach(g => {
                const label = document.createElement('label');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = g.id;
                if (selectedIds.includes(g.id)) cb.checked = true;
                const displayName = settings.lang === 'ar' ? g.name_ar : g.name_tr;
                label.appendChild(cb);
                label.appendChild(document.createTextNode(' ' + displayName));
                container.appendChild(label);
            });
        }

        // ============ ÜRÜN EKLEME / DÜZENLEME ============
        function openAddProductModal() {
            document.getElementById('prod-id').value = '';
            document.getElementById('prod-img-file').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-name-ar').value = '';
            document.getElementById('prod-name-tr').value = '';
            document.getElementById('prod-desc-ar').value = '';
            document.getElementById('prod-desc-tr').value = '';
            currentImageFile = null;
            currentImageUrl = '';
            currentImagePreview = '';
            const preview = document.getElementById('img-preview');
            preview.src = '';
            preview.style.display = 'none';

            renderGroupCheckboxes([]);
            document.getElementById('productModalTitle').innerText = settings.lang === 'ar' ? 'إضافة منتج' : 'Ürün Ekle';
            openModal('productModal');
        }

        async function editProduct(id) {
            const p = await getProductById(id);
            if (!p) return;

            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-img-file').value = '';
            document.getElementById('prod-price').value = p.price;
            document.getElementById('prod-name-ar').value = p.name_ar;
            document.getElementById('prod-name-tr').value = p.name_tr;
            document.getElementById('prod-desc-ar').value = p.desc_ar;
            document.getElementById('prod-desc-tr').value = p.desc_tr;

            currentImageUrl = p.img || '';
            currentImageFile = null;
            currentImagePreview = currentImageUrl;
            const preview = document.getElementById('img-preview');
            if (currentImagePreview) {
                preview.src = currentImagePreview;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }

            // Seçili grup ID'lerini bul
            const selectedIds = p.groups ? p.groups.map(g => g.id) : [];
            renderGroupCheckboxes(selectedIds);

            document.getElementById('productModalTitle').innerText = settings.lang === 'ar' ? 'تعديل المنتج' : 'Ürünü Düzenle';
            openModal('productModal');
        }

        // ============ ÜRÜN KAYDET (ÇOKLU GRUP DESTEKLİ) ============
        async function saveProduct() {
            const id = document.getElementById('prod-id').value;
            const price = parseFloat(document.getElementById('prod-price').value) || 0;
            const name_ar = document.getElementById('prod-name-ar').value;
            const name_tr = document.getElementById('prod-name-tr').value;
            const desc_ar = document.getElementById('prod-desc-ar').value;
            const desc_tr = document.getElementById('prod-desc-tr').value;

            // Seçili grup ID'lerini al
            const checkedBoxes = document.querySelectorAll('#prod-groups-container input[type="checkbox"]:checked');
            const selectedGroupIds = Array.from(checkedBoxes).map(cb => parseInt(cb.value));

            let imgUrl = currentImageUrl;
            if (currentImageFile) {
                try {
                    imgUrl = await uploadImageFile(currentImageFile);
                } catch (err) {
                    alert('Resim yüklenirken hata oluştu: ' + err.message);
                    return;
                }
            } else if (!imgUrl || imgUrl.startsWith('data:image')) {
                imgUrl = 'https://via.placeholder.com/300x200';
            }

            let productId = Number(id);
            try {
                if (productId) {
                    // Güncelle
                    const updated = { img: imgUrl, price, name_ar, name_tr, desc_ar, desc_tr };
                    await _supabase.from('products').update(updated).eq('id', productId);
                } else {
                    // Yeni ürün ekle
                    const { data, error } = await _supabase.from('products').insert([
                        { img: imgUrl, price, name_ar, name_tr, desc_ar, desc_tr }
                    ]).select();
                    if (error) throw error;
                    productId = data[0].id;
                }

                // product_groups tablosunu güncelle (önce eski kayıtları sil, sonra yenilerini ekle)
                await _supabase.from('product_groups').delete().eq('product_id', productId);
                if (selectedGroupIds.length > 0) {
                    const inserts = selectedGroupIds.map(gid => ({ product_id: productId, group_id: gid }));
                    await _supabase.from('product_groups').insert(inserts);
                }

                // Ürünü tekrar yükle
                await loadProducts(0, true);
                closeModal('productModal');
            } catch (err) {
                console.error('Ürün kaydedilemedi:', err);
                alert('Hata oluştu: ' + err.message);
            }
        }

        // ============ DİĞER FONKSİYONLAR (getProductById, share, cart, vs.) AYNEN ============
        // ... (mevcut kodun geri kalanı aynen, sadece product_groups ile ilgili olanlar eklendi)

        // ============ KATEGORİ FİLTRELEME (renderCategories) ============
        // renderCategories fonksiyonu aynen çalışır, sadece selectedCategory grup nesnesi olabilir.

        // ============ BAŞLATMA ============
        async function init() {
            showLoadingScreen();
            try {
                if (_supabase) {
                    const { data: { session } } = await _supabase.auth.getSession();
                    isAdmin = !!session;
                    _supabase.auth.onAuthStateChange((event, session) => {
                        isAdmin = !!session;
                        updateAdminUI();
                        renderProducts(true);
                    });

                    const { data: sData } = await _supabase.from('settings').select('*').eq('id', 1).maybeSingle();
                    if (sData) settings = { ...defaultSettings, ...sData };

                    const { data: gData } = await _supabase.from('groups').select('*');
                    if (gData && gData.length > 0) groups = gData;

                    await loadProducts(0, true);
                }
            } catch (err) {
                console.error('Başlatma Hatası:', err);
                hideLoadingScreen();
            }

            changeLanguage(settings.lang, false);
            await updateAdminUI();
            renderCategories();
            renderCart();

            const urlParams = new URLSearchParams(window.location.search);
            const productIdParam = urlParams.get('product');
            if (productIdParam) {
                setTimeout(() => openProductDetail(Number(productIdParam)), 400);
            }

            // Scroll butonu ve sonsuz scroll
            const scrollBtn = document.getElementById('scrollTopBtn');
            window.addEventListener('scroll', function() {
                if (window.scrollY > 300) scrollBtn.style.display = 'block';
                else scrollBtn.style.display = 'none';

                const nearBottom = (window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 400);
                if (nearBottom && hasMoreProducts && !isLoadingProducts) {
                    loadMoreProducts();
                }
            });
            scrollBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        }

        window.onload = init;
    </script>
</body>
</html>
