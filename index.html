<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katalog</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f7f6; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Şık Üst Menü Çubuğu (Navbar) */
        .navbar {
            background: #2c3e50; color: #fff; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000;
        }
        .navbar h1 { font-size: 1.2rem; font-weight: bold; }

        .container { flex: 1; max-width: 800px; width: 100%; margin: 0 auto; padding: 15px; }
        .search-box { margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; outline: none; }
        
        /* Footer / İletişim Alanı (En altta) */
        footer {
            background: #2c3e50; color: #fff; text-align: center;
            padding: 20px; margin-top: auto; font-size: 0.9rem;
        }
        footer p { margin: 5px 0; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1 id="app-title">Katalog</h1>
        <span>🛒</span>
    </div>

    <div class="container">
        <div class="search-box">
            <input type="text" id="search-input" onkeyup="checkSearchInput(event)" oninput="handleSearch(this.value)" placeholder="🔍 بحث عن منتج... / Ürün ara...">
        </div>
        <div id="products-container">
            </div>
    </div>

    <footer>
        <p>📞 Telefon: <span id="footer-phone">-</span></p>
        <p>✉️ E-posta: <span id="footer-email">info@ornek.com</span></p>
        <p style="font-size: 0.8rem; margin-top: 10px; opacity: 0.7;">Tüm Hakları Saklıdır © 2026</p>
    </footer>

    <script>
        // ==================== SUPABASE BAĞLANTISI (TEK VE DOĞRU TANIM) ====================
        const SUPABASE_URL = 'https://xmrdqepjtfycvtgcbkyy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtcmRxZXBqdGZ5Y3Z0Z2Nia3l5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNzkwOTAsImV4cCI6MjEwMTk1NTA5MH0.fDrMNun9fMaFj1PqAkZRpmOF17r0GCWGZNu0mc5k0dU';
        
        // Tek bir kez client oluşturuluyor
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let settings = { phone: 'Belirtilmedi' };

        function checkSearchInput(event) {
            const input = document.getElementById('search-input');
            const val = input.value.trim().toLowerCase();
            if ((event.key === 'Enter' || event.keyCode === 13) && val === 'admin log in') {
                input.value = '';
                alert('Admin giriş paneli açılıyor...');
                event.preventDefault();
            }
        }

        function handleSearch(val) {
            console.log("Aranan:", val);
        }

        // Sayfa açıldığında verileri güvenli çekme
        async function init() {
            try {
                const { data, error } = await supabase.from('settings').select('*').limit(1);
                if (!error && data && data.length > 0) {
                    settings = data[0];
                    if (settings.phone) {
                        document.getElementById('footer-phone').innerText = settings.phone;
                    }
                }
            } catch (err) {
                console.error("Veri çekme hatası:", err);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
