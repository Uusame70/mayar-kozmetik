    let settings = defaultSettings;
    let groups = defaultGroups;
    let products = defaultProducts;
    let cart = JSON.parse(localStorage.getItem('catalog_cart')) || [];
    let isAdmin = false;
    let currentBase64Image = '';
    let selectedCategory = 'ALL';
    let searchQuery = '';

    // HIZLANDIRILMIŞ: Tüm veriler aynı anda (paralel) çekilir
    async function loadFromSupabase() {
        try {
            const [gRes, pRes, sRes] = await Promise.all([
                _supabase.from('groups').select('*'),
                _supabase.from('products').select('*'),
                _supabase.from('settings').select('*').eq('id', 1).maybeSingle()
            ]);

            if (gRes.data && gRes.data.length > 0) groups = gRes.data;
            if (pRes.data && pRes.data.length > 0) products = pRes.data;
            if (sRes.data) settings = { ...defaultSettings, ...sRes.data };

            // Veriler güncellenince arayüzü sessizce yenile
            changeLanguage(settings.lang, false);
            renderCategories();
            renderProducts();
            renderCart();
        } catch (err) {
            console.log("Supabase veri çekme hatası:", err);
        }
    }

    async function saveCart() {
        localStorage.setItem('catalog_cart', JSON.stringify(cart));
    }

    async function init() {
        // 1. Önce varsayılan verilerle sayfayı anında çiz
        changeLanguage(settings.lang, false);
        renderCategories();
        renderProducts();
        renderCart();

        // 2. Yükleme ekranını hemen kaldır (kullanıcı beklemesin)
        const loadingScreen = document.getElementById('loadingScreen');
        if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            setTimeout(() => { loadingScreen.style.display = 'none'; }, 200);
        }

        // 3. Arka planda verileri ve oturum durumunu paralel yükle
        _supabase.auth.getSession().then(({ data: { session } }) => {
            isAdmin = !!session;
            updateAdminUI();
        });

        _supabase.auth.onAuthStateChange((event, session) => {
            isAdmin = !!session;
            updateAdminUI();
        });

        // Verileri arka planda indir
        loadFromSupabase();

        // URL parametresi kontrolü
        const urlParams = new URLSearchParams(window.location.search);
        const productIdParam = urlParams.get('product');
        if (productIdParam) {
            openProductDetail(Number(productIdParam));
        }
    }

    async function handleSupabaseLogin() {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value.trim();

        const { data, error } = await _supabase.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            alert((settings.lang === 'ar' ? 'خطأ في تسجيل الدخول: ' : 'Giriş Hatası: ') + error.message);
        } else {
            isAdmin = true;
            closeModal('loginModal');
            updateAdminUI();
            alert(settings.lang === 'ar' ? 'تم تسجيل الدخول بنجاح!' : 'Başarıyla giriş yapıldı!');
        }
    }

    async function handleSupabaseLogout() {
        await _supabase.auth.signOut();
        isAdmin = false;
        updateAdminUI();
        closeModal('settingsModal');
        alert(settings.lang === 'ar' ? 'تم تسجيل الخروج' : 'Oturum kapatıldı.');
    }

    function toggleLanguage() {
        const nextLang = settings.lang === 'ar' ? 'tr' : 'ar';
        changeLanguage(nextLang);
    }

    function handleSearch(val) {
        if (val.trim() === 'mayar.') {
            document.getElementById('search-input').value = '';
            searchQuery = '';
            openModal('loginModal');
            renderProducts();
            return;
        }

        searchQuery = val.trim().toLowerCase();
        renderProducts();
    }

    function changeLanguage(lang, shouldSave = true) {
        settings.lang = lang;
        if (shouldSave) updateAdminSettingsToSupabase();

        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

        const t = translations[lang] || translations.tr;

        document.getElementById('txt-app-title').innerText = settings.customAppTitle || t.appTitle;
        document.getElementById('btn-lang-toggle').innerText = t.langBtnText;
        document.getElementById('txt-cart-btn-text').innerText = t.viewCart;
        document.getElementById('txt-settings-btn-text').innerText = t.settings;
        document.getElementById('txt-total-label').innerText = t.totalLabel;
        document.getElementById('btn-checkout').innerText = settings.customCheckoutText || t.checkout;
        document.getElementById('txt-loading').innerText = t.loadingText;

        document.getElementById('txt-settings-title').innerText = t.adminPanelTitle;
        document.getElementById('txt-change-phone').innerText = t.changePhone;
        document.getElementById('txt-change-wa-header').innerText = t.changeWaHeader;
        document.getElementById('txt-change-app-title').innerText = t.changeAppTitle;
        document.getElementById('txt-change-delete-text').innerText = t.changeDeleteText;
        document.getElementById('txt-change-add-text').innerText = t.changeAddText;
        document.getElementById('txt-change-checkout-text').innerText = t.changeCheckoutText;

        document.getElementById('btn-save-settings').innerText = t.saveSettings;
        document.getElementById('btn-logout').innerText = t.logout;
        document.getElementById('btn-close-settings').innerText = t.close;
        document.getElementById('btn-add-product').innerText = t.addProduct;
        document.getElementById('btn-manage-groups').innerText = t.manageGroups;
        document.getElementById('lbl-prod-group').innerText = t.selectGroup;
        document.getElementById('txt-group-modal-title').innerText = t.groupModalTitle;
        document.getElementById('btn-save-group').innerText = t.addGroupBtn;
        document.getElementById('txt-existing-groups').innerText = t.existingGroups;
        document.getElementById('btn-close-group-modal').innerText = t.close;
        document.getElementById('lbl-prod-img').innerText = t.prodImg;
        document.getElementById('lbl-prod-price').innerText = t.prodPrice;
        document.getElementById('btn-save-prod').innerText = t.save;
        document.getElementById('btn-cancel-prod').innerText = t.cancel;
        document.getElementById('txt-cart-title').innerText = t.cartTitle;
        document.getElementById('btn-clear-cart').innerText = t.clearCart;
        document.getElementById('btn-close-cart').innerText = t.close;
        document.getElementById('txt-groups-title').innerText = t.groupsTitle;
        document.getElementById('txt-all-products-title').innerText = t.allProductsTitle;
        document.getElementById('search-input').placeholder = t.searchPlaceholder;

    function updateAdminUI() {
        const adminBar = document.getElementById('adminBar');
        const btnSettings = document.getElementById('btn-settings');

        if (isAdmin) {
            btnSettings.style.display = 'inline-block';
            adminBar.style.display = 'flex';
            document.getElementById('new-phone').value = settings.phone;
            document.getElementById('new-wa-header').value = settings.waHeader || 'طلب جديد';
            document.getElementById('new-app-title').value = settings.customAppTitle || '';
            document.getElementById('new-delete-text').value = settings.customDeleteText || '';
            document.getElementById('new-add-text').value = settings.customAddText || '';
            document.getElementById('new-checkout-text').value = settings.customCheckoutText || '';
        } else {
            btnSettings.style.display = 'none';
            adminBar.style.display = 'none';
        }
        renderProducts();
    }

    async function updateAdminSettingsToSupabase() {
        try {
            await _supabase.from('settings').upsert({ id: 1, ...settings });
        } catch (err) {
            console.error("Ayarlar kaydedilemedi:", err);
        }
    }

    async function updateAdminSettings() {
        settings.phone = document.getElementById('new-phone').value.trim() || settings.phone;
        settings.waHeader = document.getElementById('new-wa-header').value.trim() || 'طلب جديد';
        settings.customAppTitle = document.getElementById('new-app-title').value.trim();
        settings.customDeleteText = document.getElementById('new-delete-text').value.trim();
        settings.customAddText = document.getElementById('new-add-text').value.trim();
        settings.customCheckoutText = document.getElementById('new-checkout-text').value.trim();

        await updateAdminSettingsToSupabase();
        changeLanguage(settings.lang, false);
        alert(settings.lang === 'ar' ? 'تم حفظ التغييرات بنجاح' : 'Ayarlar başarıyla kaydedildi!');
    }

    function renderGroupSelect() {
        const select = document.getElementById('prod-group-select');
        select.innerHTML = '';

        if (groups.length === 0) {
            const opt = document.createElement('option');
            opt.value = '';
            opt.innerText = settings.lang === 'ar' ? 'لا توجد مجموعات' : 'Grup yok';
            select.appendChild(opt);
            return;
        }

        groups.forEach(g => {
            const opt = document.createElement('option');
            opt.value = g.id;
            opt.innerText = settings.lang === 'ar' ? `${g.name_ar} (${g.name_tr})` : `${g.name_tr} (${g.name_ar})`;
            select.appendChild(opt);
        });
    }

    function openGroupModal() {
        document.getElementById('new-group-ar').value = '';
        document.getElementById('new-group-tr').value = '';
        renderGroupsList();
        openModal('groupModal');
    }

    async function saveGroup() {
        const name_ar = document.getElementById('new-group-ar').value.trim();
        const name_tr = document.getElementById('new-group-tr').value.trim();

        if (!name_ar && !name_tr) {
            alert(settings.lang === 'ar' ? 'يرجى إدخال اسم المجموعة' : 'Lütfen grup adı girin!');
            return;
        }

        const newId = groups.length > 0 ? Math.max(...groups.map(g => g.id)) + 1 : 1;
        const newGroup = {
            id: newId,
            name_ar: name_ar || name_tr,
            name_tr: name_tr || name_ar
        };

        groups.push(newGroup);
        try {
            await _supabase.from('groups').insert([newGroup]);
        } catch (err) {
            console.error("Grup eklenemedi:", err);
        }

        renderGroupsList();
        renderGroupSelect();
        renderCategories();
        document.getElementById('new-group-ar').value = '';
        document.getElementById('new-group-tr').value = '';
    }

    async function deleteGroup(id) {
        if (confirm(settings.lang === 'ar' ? 'هل أنت تأكد من حذف هذه المجموعة؟' : 'Bu grubu silmek istediğinize emin misiniz?')) {
            groups = groups.filter(g => g.id !== id);
            try {
                await _supabase.from('groups').delete().eq('id', id);
            } catch (err) {
                console.error("Grup silinemedi:", err);
            }
            renderGroupsList();
            renderGroupSelect();
            renderCategories();
            renderProducts();
        }
    }

    function renderGroupsList() {
        const list = document.getElementById('groupsList');
        list.innerHTML = '';

        if (groups.length === 0) {
            list.innerHTML = `<p style="color:#888; text-align:center; padding:10px;">${settings.lang === 'ar' ? 'لا توجد مجموعات' : 'Henüz grup eklenmedi.'}</p>`;
            return;
        }

        groups.forEach(g => {
            const item = document.createElement('div');
            item.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #eee;';
            const name = settings.lang === 'ar' ? `${g.name_ar} / ${g.name_tr}` : `${g.name_tr} / ${g.name_ar}`;
            const deleteText = settings.customDeleteText || translations[settings.lang].delete;
            item.innerHTML = `
                <span>${name}</span>
                <button onclick="deleteGroup(${g.id})" class="btn-danger" style="padding:4px 8px; font-size:0.8rem;">${deleteText}</button>
            `;
            list.appendChild(item);
        });
    }

    function renderCategories() {
        const bar = document.getElementById('categoriesBar');
        bar.innerHTML = '';

        const t = translations[settings.lang] || translations.tr;

        const allBtn = document.createElement('button');
        allBtn.className = `cat-btn ${selectedCategory === 'ALL' ? 'active' : ''}`;
        allBtn.innerText = t.allBtn;
        allBtn.onclick = () => {
            selectedCategory = 'ALL';
            renderCategories();
            renderProducts();
        };
        bar.appendChild(allBtn);

        const catMap = new Map();

        groups.forEach(g => {
            const catKey = g.name_ar + '|' + g.name_tr;
            catMap.set(catKey, { ar: g.name_ar, tr: g.name_tr });
        });

        products.forEach(p => {
            const catAr = (p.category_ar || '').trim();
            const catTr = (p.category_tr || '').trim();
            if (catAr || catTr) {
                const catKey = catAr + '|' + catTr;
                if (!catMap.has(catKey)) {
                    catMap.set(catKey, { ar: catAr || catTr, tr: catTr || catAr });
                }
            }
        });

        catMap.forEach((catObj, catKey) => {
            const displayName = settings.lang === 'ar' ? catObj.ar : catObj.tr;
            const btn = document.createElement('button');
            btn.className = `cat-btn ${selectedCategory === catKey ? 'active' : ''}`;
            btn.innerText = displayName;
            btn.onclick = () => {
                selectedCategory = catKey;
                renderCategories();
                renderProducts();
            };
            bar.appendChild(btn);
        });
    }

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';
        const t = translations[settings.lang] || translations.tr;

        const addText = settings.customAddText || t.addToCart;
        const shareText = t.share;
        const editText = t.edit;
        const deleteText = settings.customDeleteText || t.delete;

        const filteredProducts = products.filter(p => {
            let catMatch = selectedCategory === 'ALL' || ((p.category_ar || '').trim() + '|' + (p.category_tr || '').trim()) === selectedCategory;

            let searchMatch = true;
            if (searchQuery) {
                const nameAr = (p.name_ar || '').toLowerCase();
                const nameTr = (p.name_tr || '').toLowerCase();
                searchMatch = nameAr.includes(searchQuery) || nameTr.includes(searchQuery);
            }

            return catMatch && searchMatch;
        });

        if (filteredProducts.length === 0) {
            grid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: #777; padding: 20px 0;">${t.noProductsFound}</p>`;
            return;
        }

        filteredProducts.forEach(p => {
            const name = settings.lang === 'ar' ? p.name_ar : p.name_tr;
            const catName = settings.lang === 'ar' ? (p.category_ar || '') : (p.category_tr || '');

            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                ${catName ? `<span class="product-badge">${catName}</span>` : ''}
                <img src="${p.img || 'https://via.placeholder.com/300x200'}" alt="${name}" onclick="openProductDetail(${p.id})">
                <div class="product-info">
                    <div>
                        <div class="product-title" onclick="openProductDetail(${p.id})">${name}</div>
                        <div class="product-price">${p.price} TL</div>
                    </div>
                    <div class="product-actions">
                        <button onclick="addToCart(${p.id})" class="btn-success" style="flex-grow:1;">${addText}</button>
                        <button onclick="shareProduct(${p.id})" class="btn-whatsapp" title="${shareText}">💬</button>
                        ${isAdmin ? `
                            <button onclick="editProduct(${p.id})">${editText}</button>
                            <button onclick="deleteProduct(${p.id})" class="btn-danger">${deleteText}</button>
                        ` : ''}
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function shareProduct(id) {
        const p = products.find(x => x.id === id);
        if (!p) return;

        const name = settings.lang === 'ar' ? p.name_ar : p.name_tr;
        const baseUrl = window.location.origin + window.location.pathname;
        const productUrl = `${baseUrl}?product=${p.id}`;

        const message = `${name}\n💰 Fiyat: ${p.price} TL\n🔗 Ürün Linki: ${productUrl}`;
        const waUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
        window.open(waUrl, '_blank');
    }

    function openProductDetail(id) {
        const p = products.find(x => x.id === id);
        if (!p) return;

        const name = settings.lang === 'ar' ? p.name_ar : p.name_tr;
        const desc = settings.lang === 'ar' ? p.desc_ar : p.desc_tr;
        const catName = settings.lang === 'ar' ? (p.category_ar || '') : (p.category_tr || '');

        document.getElementById('detail-img').src = p.img || 'https://via.placeholder.com/300x200';

        const catBadge = document.getElementById('detail-category');
        if (catName) {
            catBadge.innerText = catName;
            catBadge.style.display = 'inline-block';
        } else {
            catBadge.style.display = 'none';
        }

        document.getElementById('detail-title').innerText = name;
        document.getElementById('detail-desc').innerText = desc || (settings.lang === 'ar' ? 'لا يوجد وصف' : 'Açıklama bulunmuyor.');
        document.getElementById('detail-price').innerText = `${p.price} TL`;

        const addBtn = document.getElementById('detail-add-btn');
        addBtn.innerText = settings.customAddText || translations[settings.lang].addToCart;
        addBtn.onclick = function() {
            addToCart(p.id);
            closeModal('productDetailModal');
        };

        const shareBtn = document.getElementById('detail-share-btn');
        shareBtn.innerText = `💬 ${translations[settings.lang].share}`;
        shareBtn.onclick = function() {
            shareProduct(p.id);
        };

        openModal('productDetailModal');
    }

    function previewSelectedImage(input) {
        const file = input.files[0];
        const preview = document.getElementById('img-preview');

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                currentBase64Image = e.target.result;
                preview.src = currentBase64Image;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    function openAddProductModal() {
        renderGroupSelect();
        document.getElementById('prod-id').value = '';
        document.getElementById('prod-img-file').value = '';
        document.getElementById('prod-price').value = '';
        document.getElementById('prod-name-ar').value = '';
        document.getElementById('prod-name-tr').value = '';
        document.getElementById('prod-desc-ar').value = '';
        document.getElementById('prod-desc-tr').value = '';

        currentBase64Image = '';
        const preview = document.getElementById('img-preview');
        preview.src = '';
        preview.style.display = 'none';

        document.getElementById('productModalTitle').innerText = settings.lang === 'ar' ? 'إضافة منتج' : 'Ürün Ekle';
        openModal('productModal');
    }

    function editProduct(id) {
        const p = products.find(x => x.id === id);
        if (!p) return;

        renderGroupSelect();

        document.getElementById('prod-id').value = p.id;
        document.getElementById('prod-img-file').value = '';
        document.getElementById('prod-price').value = p.price;
        document.getElementById('prod-name-ar').value = p.name_ar;
        document.getElementById('prod-name-tr').value = p.name_tr;
        document.getElementById('prod-desc-ar').value = p.desc_ar;
        document.getElementById('prod-desc-tr').value = p.desc_tr;

        const matchGroup = groups.find(g => (g.name_ar === p.category_ar && g.name_tr === p.category_tr) || g.name_tr === p.category_tr || g.name_ar === p.category_ar);
        if (matchGroup) {
            document.getElementById('prod-group-select').value = matchGroup.id;
        }

        currentBase64Image = p.img || '';
        const preview = document.getElementById('img-preview');
        if (currentBase64Image) {
            preview.src = currentBase64Image;
            preview.style.display = 'block';
        } else {
            preview.style.display = 'none';
        }

        document.getElementById('productModalTitle').innerText = settings.lang === 'ar' ? 'تعديل المنتج' : 'Ürünü Düzenle';
        openModal('productModal');
    }

    async function saveProduct() {
        const id = document.getElementById('prod-id').value;
        const price = parseFloat(document.getElementById('prod-price').value) || 0;
        const selectedGroupId = parseInt(document.getElementById('prod-group-select').value);

        const selectedGroup = groups.find(g => g.id === selectedGroupId);
        const category_ar = selectedGroup ? selectedGroup.name_ar : '';
        const category_tr = selectedGroup ? selectedGroup.name_tr : '';

        const name_ar = document.getElementById('prod-name-ar').value;
        const name_tr = document.getElementById('prod-name-tr').value;
        const desc_ar = document.getElementById('prod-desc-ar').value;
        const desc_tr = document.getElementById('prod-desc-tr').value;
        const img = currentBase64Image || 'https://via.placeholder.com/300x200';

        if (id) {
            const index = products.findIndex(x => x.id == id);
            if (index !== -1) {
                products[index] = { id: Number(id), img, price, category_ar, category_tr, name_ar, name_tr, desc_ar, desc_tr };
                try {
                    await _supabase.from('products').update(products[index]).eq('id', id);
                } catch (err) {
                    console.error("Ürün güncellenemedi:", err);
                }
            }
        } else {
            const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
            const newProd = { id: newId, img, price, category_ar, category_tr, name_ar, name_tr, desc_ar, desc_tr };
            products.push(newProd);
            try {
                await _supabase.from('products').insert([newProd]);
            } catch (err) {
                console.error("Ürün eklenemedi:", err);
            }
        }

        renderCategories();
        renderProducts();
        closeModal('productModal');
    }

    async function deleteProduct(id) {
        if (confirm(settings.lang === 'ar' ? 'هل أنت تأكد من حذف هذا المنتج؟' : 'Bu ürünü silmek istediğinize emin misiniz?')) {
            products = products.filter(p => p.id !== id);
            cart = cart.filter(c => c.id !== id);
            try {
                await _supabase.from('products').delete().eq('id', id);
            } catch (err) {
                console.error("Ürün silinemedi:", err);
            }
            renderCategories();
            renderProducts();
            renderCart();
        }
    }

    function addToCart(id) {
        const item = cart.find(c => c.id === id);
        if (item) {
            item.qty++;
        } else {
            cart.push({ id: id, qty: 1 });
        }
        saveCart();
        renderCart();
    }

    function updateQty(id, delta) {
        const item = cart.find(c => c.id === id);
        if (item) {
            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(c => c.id !== id);
            }
        }
        saveCart();
        renderCart();
    }

    function removeFromCart(id) {
        cart = cart.filter(c => c.id !== id);
        saveCart();
        renderCart();
    }

    function clearCart() {
        if (cart.length === 0) return;
        if (confirm(translations[settings.lang].clearCartConfirm)) {
            cart = [];
            saveCart();
            renderCart();
        }
    }

    function renderCart() {
        const cartList = document.getElementById('cartList');
        cartList.innerHTML = '';

        let totalQty = 0;
        let totalPrice = 0;

        if (cart.length === 0) {
            cartList.innerHTML = `<p style="text-align: center; color: #888; padding: 20px 0;">${translations[settings.lang].cartEmpty}</p>`;
        } else {
            cart.forEach(c => {
                const prod = products.find(p => p.id === c.id);
                if (prod) {
                    const name = settings.lang === 'ar' ? prod.name_ar : prod.name_tr;
                    const itemTotal = prod.price * c.qty;
                    totalQty += c.qty;
                    totalPrice += itemTotal;
                    const deleteText = settings.customDeleteText || translations[settings.lang].delete;

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'cart-item';
                    itemDiv.innerHTML = `
                        <div class="cart-item-details">
                            <strong>${name}</strong><br>
                            <small>${prod.price} TL x ${c.qty} = ${itemTotal} TL</small>
                        </div>
                        <div class="qty-btns">
                            <button onclick="updateQty(${prod.id}, -1)">-</button>
                            <span>${c.qty}</span>
                            <button onclick="updateQty(${prod.id}, 1)">+</button>
                        </div>
                        <button onclick="removeFromCart(${prod.id})" class="btn-remove-item" title="${deleteText}">🗑️</button>
                    `;
                    cartList.appendChild(itemDiv);
                }
            });
        }

        document.getElementById('cart-count').innerText = totalQty;
        document.getElementById('cart-total-price').innerText = totalPrice;
    }

    function formatPhoneForWa(phoneStr) {
        let digits = phoneStr.replace(/[^0-9]/g, '');
        if (digits.startsWith('0')) {
            digits = '9' + digits;
        } else if (digits.length === 10 && digits.startsWith('5')) {
            digits = '90' + digits;
        }
        return digits;
    }

    function completeOrder() {
        if (cart.length === 0) {
            alert(settings.lang === 'ar' ? 'السلة فارغة!' : 'Sepetiniz boş!');
            return;
        }

        let messageLines = [];
        let totalQty = 0;
        let grandTotal = 0;

        const customHeader = settings.waHeader || 'طلب جديد';
        const activeLangText = settings.lang === 'ar' ? 'العربية' : 'Türkçe';

        messageLines.push(`${customHeader} (${activeLangText})`);

        cart.forEach(c => {
            const prod = products.find(p => p.id === c.id);
            if (prod) {
                const name = prod.name_ar || prod.name_tr; 
                const itemTotal = prod.price * c.qty;
                totalQty += c.qty;
                grandTotal += itemTotal;

                messageLines.push(`( ${name} ) ( ${prod.price} TL ) ( ${c.qty} عدد ) ( ${itemTotal} TL )`);
            }
        });

        messageLines.push(`( إجمالي المنتجات: ${totalQty} ) ( المبلغ الإجمالي: ${grandTotal} TL )`);

        const fullMessage = messageLines.join('\n');
        const encodedMessage = encodeURIComponent(fullMessage);

        const cleanPhone = formatPhoneForWa(settings.phone);
        const waUrl = `https://wa.me/${cleanPhone}?text=${encodedMessage}`;

        window.open(waUrl, '_blank');
    }

    function openModal(id) {
        document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    window.onload = init;
</script>
