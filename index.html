<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katalog</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f7f6; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Şık Üst Menü Çubuğu (Navbar) */
        .navbar {
            background: #2c3e50; color: #fff; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000;
        }
        .navbar h1 { font-size: 1.2rem; font-weight: bold; }
        .nav-buttons { display: flex; gap: 10px; align-items: center; }
        .lang-btn { background: #34495e; color: #fff; border: 1px solid #fff; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.9rem; }

        .container { flex: 1; max-width: 800px; width: 100%; margin: 0 auto; padding: 15px; }
        .search-box { margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; outline: none; }
        
        /* Admin Giriş Modalı */
        #admin-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content {
            background: #fff; padding: 25px; border-radius: 10px; width: 90%; max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); text-align: center;
        }
        .modal-content h3 { margin-bottom: 15px; color: #2c3e50; }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .modal-content button { background: #2c3e50; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .close-btn { background: #e74c3c !important; margin-top: 10px; }

        /* Admin Yönetim Paneli (Giriş Yapınca Görünür) */
        #admin-panel {
            display: none; background: #fff; padding: 20px; border-radius: 10px;
            margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 2px dashed #2c3e50;
        }
        #admin-panel h3 { color: #2c3e50; margin-bottom: 10px; }
        #admin-panel input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        #admin-panel button { background: #27ae60; color: #fff; border: none; padding: 10px; border-radius: 5px; width: 100%; cursor: pointer; font-weight: bold; }
        .logout-btn { background: #c0392b !important; margin-top: 5px; }

        /* Footer / İletişim Alanı */
        footer {
            background: #2c3e50; color: #fff; text-align: center;
            padding: 20px; margin-top: auto; font-size: 0.9rem;
        }
        footer p { margin: 5px 0; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1 id="app-title">كتالوج المنتجات</h1>
        <div class="nav-buttons">
            <button class="lang-btn" onclick="toggleLanguage()">TR / AR</button>
            <span>🛒</span>
        </div>
    </div>

    <div class="container">
        <div id="admin-panel">
            <h3 id="admin-panel-title">🔒 Admin Paneli</h3>
            <input type="text" id="new-phone-input" placeholder="Yeni telefon numarası girin">
            <button onclick="updatePhoneInSupabase()" id="update-phone-btn">Telefonu Güncelle</button>
            <button class="logout-btn" onclick="logoutAdmin()" id="logout-btn">Çıkış Yap</button>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" onkeyup="checkSearchInput(event)" placeholder="🔍 بحث عن منتج... / Ürün ara...">
        </div>
        <div id="products-container"></div>
    </div>

    <div id="admin-modal">
        <div class="modal-content">
            <h3 id="modal-title">🔒 Admin Girişi</h3>
            <input type="email" id="admin-email" placeholder="E-posta adresiniz">
            <input type="password" id="admin-password" placeholder="Şifreniz">
            <button onclick="loginAdmin()" id="login-btn">Giriş Yap</button>
            <button class="close-btn" onclick="closeAdminModal()" id="close-btn">Kapat</button>
        </div>
    </div>

    <footer>
        <p><span id="phone-label">📞 Telefon:</span> <span id="footer-phone">-</span></p>
        <p><span id="email-label">✉️ E-posta:</span> <span id="footer-email">info@ornek.com</span></p>
        <p style="font-size: 0.8rem; margin-top: 10px; opacity: 0.7;" id="footer-rights">Tüm Hakları Saklıdır © 2026</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://xmrdqepjtfycvtgcbkyy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtcmRxZXBqdGZ5Y3Z0Z2Nia3l5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNzkwOTAsImV4cCI6MjEwMTk1NTA5MH0.fDrMNun9fMaFj1PqAkZRpmOF17r0GCWGZNu0mc5k0dU';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentLang = 'ar'; // Varsayılan Arapça

        const translations = {
            ar: {
                title: "كتالوج المنتجات",
                searchPlaceholder: "🔍 بحث عن منتج...",
                phoneLabel: "📞 الهاتف:",
                emailLabel: "✉️ البريد الإلكتروني:",
                rights: "جميع الحقوق محفوظة © 2026",
                modalTitle: "🔒 تسجيل دخول المشرف",
                emailPlaceholder: "البريد الإلكتروني",
                passPlaceholder: "كلمة المرور",
                loginText: "تسجيل الدخول",
                closeText: "إغلاق",
                adminTitle: "🔒 لوحة تحكم المشرف",
                phoneInputPlaceholder: "أدخل رقم الهاتف الجديد",
                updateBtn: "تحديث رقم الهاتف",
                logoutText: "تسجيل الخروج"
            },
            tr: {
                title: "Ürün Kataloğu",
                searchPlaceholder: "🔍 Ürün ara...",
                phoneLabel: "📞 Telefon:",
                emailLabel: "✉️ E-posta:",
                rights: "Tüm Hakları Saklıdır © 2026",
                modalTitle: "🔒 Admin Girişi",
                emailPlaceholder: "E-posta adresiniz",
                passPlaceholder: "Şifreniz",
                loginText: "Giriş Yap",
                closeText: "Kapat",
                adminTitle: "🔒 Admin Yönetim Paneli",
                phoneInputPlaceholder: "Yeni telefon numarası girin",
                updateBtn: "Telefonu Güncelle",
                logoutText: "Çıkış Yap"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'tr' : 'ar';
            const htmlRoot = document.getElementById('html-root');
            htmlRoot.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            htmlRoot.setAttribute('lang', currentLang);

            const t = translations[currentLang];
            document.getElementById('app-title').innerText = t.title;
            document.getElementById('search-input').placeholder = t.searchPlaceholder;
            document.getElementById('phone-label').innerText = t.phoneLabel;
            document.getElementById('email-label').innerText = t.emailLabel;
            document.getElementById('footer-rights').innerText = t.rights;
            document.getElementById('modal-title').innerText = t.modalTitle;
            document.getElementById('admin-email').placeholder = t.emailPlaceholder;
            document.getElementById('admin-password').placeholder = t.passPlaceholder;
            document.getElementById('login-btn').innerText = t.loginText;
            document.getElementById('close-btn').innerText = t.closeText;
            document.getElementById('admin-panel-title').innerText = t.adminTitle;
            document.getElementById('new-phone-input').placeholder = t.phoneInputPlaceholder;
            document.getElementById('update-phone-btn').innerText = t.updateBtn;
            document.getElementById('logout-btn').innerText = t.logoutText;
        }

        function checkSearchInput(event) {
            const input = document.getElementById('search-input');
            const val = input.value.trim().toLowerCase();
            if ((event.key === 'Enter' || event.keyCode === 13) && val === 'admin log in') {
                input.value = '';
                document.getElementById('admin-modal').style.display = 'flex';
                event.preventDefault();
            }
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        async function loginAdmin() {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert('Giriş başarısız: ' + error.message);
            } else {
                alert('Giriş başarılı! Admin paneli açılıyor...');
                closeAdminModal();
                document.getElementById('admin-panel').style.display = 'block'; // Admin panelini aç
            }
        }

        async function logoutAdmin() {
            await supabaseClient.auth.signOut();
            document.getElementById('admin-panel').style.display = 'none';
            alert('Çıkış yapıldı.');
        }

        async function updatePhoneInSupabase() {
            const newPhone = document.getElementById('new-phone-input').value;
            if (!newPhone) return alert('Lütfen bir numara girin.');

            const { error } = await supabaseClient
                .from('settings')
                .update({ phone: newPhone })
                .eq('id', 1); // Tablonuzdaki ID yapısına göre değişebilir

            if (error) {
                alert('Güncellenemedi: ' + error.message);
            } else {
                alert('Telefon numarası başarıyla güncellendi!');
                document.getElementById('footer-phone').innerText = newPhone;
                document.getElementById('new-phone-input').value = '';
            }
        }

        async function init() {
            try {
                const { data, error } = await supabaseClient.from('settings').select('*').limit(1);
                if (!error && data && data.length > 0) {
                    if (data[0].phone) {
                        document.getElementById('footer-phone').innerText = data[0].phone;
                    }
                }
            } catch (err) {
                console.error("Veri çekme hatası:", err);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
